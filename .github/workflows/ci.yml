name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (macOS host)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

  ios:
    name: Typecheck for iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build every product for iOS
        # pipefail is load-bearing: without it xcpretty's exit code masks a failed build and this
        # job reports green on code that does not compile.
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme PrivateSigner-Package \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
