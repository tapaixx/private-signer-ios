name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (macOS host)
    runs-on: [self-hosted, macOS, ARM64]
    # A self-hosted runner is a machine in someone's house. On a public repository, a workflow
    # that runs on pull requests will happily run a stranger's code on it — this is the first
    # thing GitHub's own documentation warns about. A pull request from a fork gets no runner
    # here; one from a branch of this repository, which only people with write access can push,
    # does.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

  ios:
    name: Typecheck for iOS
    runs-on: [self-hosted, macOS, ARM64]
    # A self-hosted runner is a machine in someone's house. On a public repository, a workflow
    # that runs on pull requests will happily run a stranger's code on it — this is the first
    # thing GitHub's own documentation warns about. A pull request from a fork gets no runner
    # here; one from a branch of this repository, which only people with write access can push,
    # does.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Build every product for iOS
        # pipefail is load-bearing: without it xcpretty's exit code masks a failed build and this
        # job reports green on code that does not compile.
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme PrivateSigner-Package \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
